<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nightfall: The Last Signal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1115; color: #e9dec4; font-family: Georgia, serif; overflow: hidden; }
    body::before { content: ""; position: fixed; inset: -20%; background: repeating-linear-gradient(111deg, transparent 0 90px, rgba(112,146,129,.08) 91px 93px); transform: rotate(-7deg); }
    main { position: relative; width: min(720px, calc(100% - 48px)); text-align: center; padding: 72px 32px; border-top: 2px solid #e7a84d; border-bottom: 1px solid #456056; background: rgba(21,29,32,.78); }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4.7rem); letter-spacing: .16em; }
    h2 { margin: 10px 0 42px; color: #e7a84d; font-size: .95rem; letter-spacing: .35em; }
    p { color: #b6c4b9; line-height: 1.7; }
    a { display: inline-block; margin-top: 24px; padding: 15px 28px; color: #e9dec4; text-decoration: none; font: 700 .8rem system-ui, sans-serif; letter-spacing: .12em; border: 1px solid #6b877a; background: #172123; }
    a:hover { background: #263936; border-color: #e7a84d; }
    small { display: block; margin-top: 44px; color: #718178; font: .7rem system-ui, sans-serif; letter-spacing: .09em; }
  </style>
</head>
<body>
  <main>
    <h1>NIGHTFALL</h1>
    <h2>THE LAST SIGNAL</h2>
    <p>An original, asset-free asymmetric survival-horror prototype built in Godot 4. Choose Survivor or Warden, repair relays, hunt through the fog, and escape the night.</p>
    <a href="https://github.com/pandavid153/dead-by-dunklight">VIEW AND RUN THE GODOT PROJECT</a>
    <small>GODOT 4.3+ REQUIRED FOR LOCAL PLAY</small>
  </main>
</body>
</html>
